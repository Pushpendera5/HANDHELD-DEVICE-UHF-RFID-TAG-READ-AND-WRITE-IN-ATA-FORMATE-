# Helps keep builds deterministic and compatible with modern Android toolchains.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# org.gradle.java.home=C\:\\Program Files\\Java\\jdk-17
org.gradle.java.home=C\:\\Program Files\\Eclipse Adoptium\\jdk-17.0.19.10-hotspot

# Modern Android defaults
android.useAndroidX=true
android.enableJetifier=true
# Robolectric pulls bcprov-jdk18on with Java 21 bytecode; Jetifier cannot transform it (major 65).
android.jetifier.ignorelist=bcprov-jdk18on
android.suppressUnsupportedCompileSdk=35

kotlin.code.style=official

