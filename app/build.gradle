plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'jacoco'
}

android {
    namespace 'com.rfidsoftwares'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rfidsoftwares'
        minSdk 24
        targetSdk 35

        versionCode 1
        versionName '0.1.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        debug {
            // Allow emulator / UHF test-mode on x86_64 for compatibility spike.
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            }
            minifyEnabled false
        }
        release {
            // Keep release artifacts aligned with the plan.
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        // Phase 1 relies on XML layouts; view binding reduces boilerplate.
        viewBinding true
    }

    // Robolectric: merge assets/resources into unit test classpath (fixture JSON under assets/).
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    // Room MigrationTestHelper expects exported JSON under assets/schemas/<databaseFqcn>/
    sourceSets {
        androidTest.assets.srcDir("$buildDir/generated/roomSchemasAndroidTest")
    }
}

kapt {
    arguments {
        // Room migration strategy: export schema snapshots for future migration validation.
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}

dependencies {
    // Portable RFID Hardware SDK JAR & AAR inclusion (looks in app/libs)
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    // ---------- UI stack (Phase 1) ----------
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Navigation + fragments
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.activity:activity-ktx:1.7.2'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'

    // State holder / lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'

    // Lists for provider rows / future feature rows
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ---------- Phase 2 local persistence (Room) ----------
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // ---------- Phase 3 adapter networking ----------
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.5.0'

    androidTestImplementation "androidx.room:room-testing:$room_version"
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}

tasks.register('copyRoomSchemasForAndroidTest', Copy) {
    from("$projectDir/schemas")
    into("$buildDir/generated/roomSchemasAndroidTest/schemas")
}

afterEvaluate {
    tasks.named('mergeDebugAndroidTestAssets').configure { dependsOn('copyRoomSchemasForAndroidTest') }
}

jacoco {
    toolVersion = "0.8.12"
}

tasks.register("jacocoTestReport", JacocoReport) {
    dependsOn "testDebugUnitTest"

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    def excludes = [
            '**/R.class',
            '**/R$*.class',
            '**/BuildConfig.*',
            '**/Manifest*.*',
            '**/*Test*.*',
            '**/*$Companion.class',
    ]

    def kotlinClasses = fileTree(dir: "$buildDir/tmp/kotlin-classes/debug", excludes: excludes)
    def javaClasses = fileTree(dir: "$buildDir/intermediates/javac/debug/classes", excludes: excludes)
    classDirectories.setFrom(files([kotlinClasses, javaClasses]))

    sourceDirectories.setFrom(files([
            "$projectDir/src/main/java",
            "$projectDir/src/main/kotlin",
    ]))

    executionData.setFrom(fileTree(dir: buildDir, includes: [
            "jacoco/testDebugUnitTest.exec",
            "outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec",
    ]))
}

